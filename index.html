<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b30"><link rel="manifest" href="manifest.webmanifest"><title>Compras 175</title><style>body{margin:0;background:#f3f6f3;color:#19372d;font:16px system-ui}main{max-width:650px;margin:auto;padding:16px}header{background:#173b30;color:white;border-radius:18px;padding:20px}h1{margin:0 0 16px}input,button{font:inherit;border-radius:10px;padding:10px;box-sizing:border-box}input{border:1px solid #bccbc1;min-width:0}button{border:0;background:#236d50;color:white;cursor:pointer}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stats div{background:#e3eee7;color:#173b30;border-radius:12px;padding:12px}.stats strong{display:block;font-size:22px}.line{display:flex;align-items:center;gap:8px;border-bottom:1px solid #dce5de;padding:10px 0}.line label{flex:1}.line input[type=checkbox]{width:22px;height:22px}.line input.price{width:82px;text-align:right}.line input.qty{width:53px;text-align:center}.subtotal{font-size:12px;min-width:66px;text-align:right;color:#236d50}.line{flex-wrap:wrap}.line label{min-width:110px}.done label{text-decoration:line-through;opacity:.55}.delete{background:#a33;padding:8px}.add{display:flex;gap:8px}.add input{flex:1}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.actions button{font-size:13px}.hint{font-size:13px;color:#53675c}.negative{color:#b22!important}</style></head><body><main><header><h1>🛒 As minhas compras</h1><label>Orçamento (€) <input id="budget" inputmode="decimal" style="width:115px" value="175,00"></label><div class="stats"><div><small>Total gasto</small><strong id="total">0,00 €</strong></div><div><small>Disponível</small><strong id="balance">175,00 €</strong></div></div><p id="count"></p></header><h2>Lista de compras</h2><div id="list"></div><h2>Adicionar produto</h2><form id="add" class="add"><input id="new" placeholder="Nome do produto" required><button>Adicionar</button></form><div class="actions"><button id="export">Exportar backup</button><button id="import">Importar backup</button><button id="reset">Limpar preços</button></div><input id="file" type="file" accept="application/json" hidden><p class="hint">Gravação automática neste navegador. Exporta um backup para proteger os dados ao trocar de telemóvel ou limpar o navegador.</p></main><script>
const names=['Toalhitas','Lub','Velas','Desodorizante homem','Maionese','Ketchup','Cocktail','Sumos','Iogurte balde','Iogurte pequenos','Iogurte proteína','Manteiga','Queijo fatiado','Queijo ralado','Queijo fresco','Bacon','Comida cães e gato','Areia + sílica','Leite','Fruta kiwi bananas maçãs','Pimentos','Batatas','Cebolas','Atum','Cogumelos','Salsichas','Polpa tomate','Chá verde','Chá preto','Muesly'];
const KEY='compras175-v1',defaults=()=>({budget:'175,00',items:names.map((name,i)=>({id:i+1,name,price:'',qty:1,checked:false,extra:false}))});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults();if(!Array.isArray(state.items))throw Error()}catch{state=defaults()}
const euro=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n),num=v=>{v=String(v||'').replace(/\s/g,'');if(v.includes(',')&&v.includes('.'))v=v.replace(/\./g,'').replace(',','.');else v=v.replace(',','.');return Number(v)||0},save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Não foi possível guardar. Exporta um backup.')}update()},list=document.getElementById('list');
function update(){const t=state.items.reduce((s,x)=>s+num(x.price)*Math.max(1,Number(x.qty)||1),0),b=num(state.budget)-t;document.getElementById('total').textContent=euro(t);const el=document.getElementById('balance');el.textContent=euro(b);el.classList.toggle('negative',b<0);document.getElementById('count').textContent=state.items.filter(x=>x.price.trim()).length+' de '+state.items.length+' produtos com preço'}
function render(){list.replaceChildren();state.items.forEach(x=>{const row=document.createElement('div');row.className='line'+(x.checked?' done':'');const c=document.createElement('input');c.type='checkbox';c.checked=x.checked;c.onchange=()=>{x.checked=c.checked;row.classList.toggle('done',x.checked);save()};const label=document.createElement('label');label.textContent=x.name;const price=document.createElement('input');price.className='price';price.inputMode='decimal';price.placeholder='0,00';price.value=x.price;price.setAttribute('aria-label','Preço '+x.name);price.oninput=()=>{x.price=price.value;save()};const qty=document.createElement('input');qty.type='number';qty.min='1';qty.step='1';qty.value=x.qty||1;qty.className='qty';qty.setAttribute('aria-label','Quantidade '+x.name);qty.onchange=()=>{x.qty=Math.max(1,Math.floor(Number(qty.value)||1));qty.value=x.qty;save();render()};const subtotal=document.createElement('span');subtotal.className='subtotal';subtotal.textContent=euro(num(x.price)*Math.max(1,Number(x.qty)||1));price.oninput=()=>{x.price=price.value;subtotal.textContent=euro(num(x.price)*Math.max(1,Number(x.qty)||1));save()};row.append(c,label,qty,price,subtotal);if(x.extra){const d=document.createElement('button');d.className='delete';d.textContent='×';d.onclick=()=>{state.items=state.items.filter(y=>y.id!==x.id);save();render()};row.append(d)}list.append(row)});update()}
document.getElementById('budget').value=state.budget;document.getElementById('budget').oninput=e=>{state.budget=e.target.value;save()};document.getElementById('add').onsubmit=e=>{e.preventDefault();const input=document.getElementById('new'),name=input.value.trim();if(!name)return;state.items.push({id:Math.max(0,...state.items.map(x=>x.id))+1,name,price:'',qty:1,checked:false,extra:true});input.value='';save();render()};document.getElementById('reset').onclick=()=>{if(confirm('Limpar preços e marcações?')){state.items.forEach(x=>{x.price='';x.qty=1;x.checked=false});save();render()}};document.getElementById('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='compras-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(typeof d.budget!=='string'||!Array.isArray(d.items)||!d.items.every(x=>typeof x.id==='number'&&typeof x.name==='string'&&typeof x.price==='string'))throw Error('Formato inválido');if(confirm('Substituir lista atual pelo backup?')){state=d;save();document.getElementById('budget').value=state.budget;render()}}catch(err){alert('Erro: '+err.message)}e.target.value=''};render();
</script></body></html>
